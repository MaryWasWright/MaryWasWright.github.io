<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.18"/></feComponentTransfer>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="ridge">
      <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="3" seed="3" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="14"/>
    </filter>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7e7ea"/>
      <stop offset="0.35" stop-color="#f4e7c8"/>
      <stop offset="0.7" stop-color="#e4d5ef"/>
      <stop offset="1" stop-color="#f7f1e3"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#wash)"/>
  <g filter="url(#soft)" opacity="0.72">
    <ellipse cx="240" cy="160" rx="280" ry="160" fill="#9ec9c4"/>
    <ellipse cx="1280" cy="120" rx="260" ry="150" fill="#c9b4de"/>
    <ellipse cx="900" cy="80" rx="220" ry="90" fill="#f3d27a"/>
    <ellipse cx="420" cy="720" rx="300" ry="140" fill="#7ea8c9"/>
    <ellipse cx="1400" cy="680" rx="240" ry="160" fill="#d9a35a"/>
    <ellipse cx="820" cy="500" rx="200" ry="120" fill="#e8c4c0"/>
  </g>
  <g filter="url(#ridge)" fill="none" stroke-linecap="round">
    <path d="M80 60 C140 180 90 260 180 340" stroke="#1e3a4c" stroke-width="7" opacity="0.55"/>
    <path d="M220 40 C260 200 310 240 280 410" stroke="#c45b3a" stroke-width="5" opacity="0.5"/>
    <path d="M1480 30 C1390 160 1510 250 1410 390" stroke="#2f6f68" stroke-width="8" opacity="0.45"/>
    <path d="M1320 20 C1360 190 1280 260 1340 430" stroke="#b0893a" stroke-width="6" opacity="0.6"/>
    <path d="M40 820 C180 760 260 880 420 800" stroke="#4a2c6a" stroke-width="6" opacity="0.35"/>
    <path d="M1560 760 C1440 820 1480 880 1320 860" stroke="#1e3a4c" stroke-width="9" opacity="0.4"/>
  </g>
  <g filter="url(#ridge)">
    <circle cx="180" cy="210" r="11" fill="#1e3a4c" opacity="0.55"/>
    <circle cx="310" cy="90" r="7" fill="#c45b3a" opacity="0.55"/>
    <circle cx="1450" cy="180" r="13" fill="#b0893a" opacity="0.65"/>
    <circle cx="1380" cy="70" r="6" fill="#2f6f68" opacity="0.5"/>
    <circle cx="90" cy="540" r="9" fill="#7ea8c9" opacity="0.55"/>
    <circle cx="1510" cy="520" r="8" fill="#4a2c6a" opacity="0.4"/>
    <ellipse cx="260" cy="330" rx="18" ry="8" fill="#d9a35a" opacity="0.45" transform="rotate(-25 260 330)"/>
    <ellipse cx="1200" cy="240" rx="22" ry="7" fill="#c45b3a" opacity="0.35" transform="rotate(18 1200 240)"/>
  </g>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.35"/>
</svg>
