<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
  <title id="title">The Age Ladder — Great Pyrenees guardian training</title>
  <desc id="desc">Three training stages: bonding pen at 8 to 16 weeks, bigger paddock at 4 to 6 months, and night watch until 18 months.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="1" stop-color="#0c1c38"/>
    </linearGradient>
    <linearGradient id="paint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a3a1c"/>
      <stop offset=".45" stop-color="#d4b45a"/>
      <stop offset="1" stop-color="#2d6a72"/>
    </linearGradient>
  </defs>
  <rect width="720" height="1080" fill="url(#sky)"/>
  <rect width="720" height="14" fill="url(#paint)"/>
  <circle cx="640" cy="78" r="28" fill="#d4b45a"/>
  <text x="360" y="64" text-anchor="middle" fill="#f4ead4" font-family="Georgia, serif" font-size="42" font-weight="700">THE AGE LADDER</text>
  <text x="360" y="96" text-anchor="middle" fill="#d4b45a" font-family="Georgia, serif" font-size="18">Great Pyrenees guardian training</text>
  <text x="360" y="118" text-anchor="middle" fill="#d4c7ab" font-family="Georgia, serif" font-size="13" letter-spacing="3">SOUTHWEST GUARDIAN</text>

  <rect x="28" y="142" width="664" height="270" rx="16" fill="#f7f1e3"/>
  <text x="48" y="176" fill="#07101f" font-family="Georgia, serif" font-size="20" font-weight="700">STAGE ONE</text>
  <text x="48" y="202" fill="#b8923a" font-family="Georgia, serif" font-size="16">8–16 WEEKS · The bonding pen</text>
  <text x="48" y="240" fill="#1b2433" font-family="Georgia, serif" font-size="18">Small pen. Quiet, dog-wise stock.</text>
  <text x="48" y="268" fill="#1b2433" font-family="Georgia, serif" font-size="18">Correct chase and mouth at once.</text>
  <text x="48" y="296" fill="#1b2433" font-family="Georgia, serif" font-size="18">Reward the pup that lies down with them.</text>
  <text x="48" y="338" fill="#2d6a72" font-family="Georgia, serif" font-size="16">Food and praise happen with the animals — not on the porch.</text>
  <ellipse cx="600" cy="300" rx="70" ry="48" fill="#f4ead4" stroke="#d4c7ab" stroke-width="2"/>
  <ellipse cx="600" cy="278" rx="36" ry="28" fill="#f4ead4" stroke="#d4c7ab" stroke-width="2"/>
  <circle cx="588" cy="274" r="3" fill="#07101f"/>
  <circle cx="608" cy="274" r="3" fill="#07101f"/>

  <rect x="28" y="430" width="664" height="270" rx="16" fill="#f7f1e3"/>
  <text x="48" y="464" fill="#07101f" font-family="Georgia, serif" font-size="20" font-weight="700">STAGE TWO</text>
  <text x="48" y="490" fill="#b8923a" font-family="Georgia, serif" font-size="16">4–6 MONTHS · Bigger paddock</text>
  <text x="48" y="528" fill="#1b2433" font-family="Georgia, serif" font-size="18">Wider fence. Still supervised.</text>
  <text x="48" y="556" fill="#1b2433" font-family="Georgia, serif" font-size="18">The feeder stays in the livestock area.</text>
  <text x="48" y="584" fill="#1b2433" font-family="Georgia, serif" font-size="18">Do not prize the dog for leaving stock.</text>
  <text x="48" y="626" fill="#2d6a72" font-family="Georgia, serif" font-size="16">The job is growing. The sofa is not the classroom.</text>
  <ellipse cx="600" cy="588" rx="78" ry="56" fill="#f4ead4" stroke="#d4c7ab" stroke-width="2"/>
  <ellipse cx="600" cy="548" rx="40" ry="30" fill="#f4ead4" stroke="#d4c7ab" stroke-width="2"/>
  <circle cx="586" cy="544" r="3" fill="#07101f"/>
  <circle cx="610" cy="544" r="3" fill="#07101f"/>

  <rect x="28" y="718" width="664" height="270" rx="16" fill="#f7f1e3"/>
  <text x="48" y="752" fill="#07101f" font-family="Georgia, serif" font-size="20" font-weight="700">STAGE THREE</text>
  <text x="48" y="778" fill="#b8923a" font-family="Georgia, serif" font-size="16">6–18 MONTHS · Not finished yet</text>
  <text x="48" y="816" fill="#1b2433" font-family="Georgia, serif" font-size="18">On watch. Night work is the old radio.</text>
  <text x="48" y="844" fill="#1b2433" font-family="Georgia, serif" font-size="18">Do not leave a teenager with fragile newborns.</text>
  <text x="48" y="872" fill="#1b2433" font-family="Georgia, serif" font-size="18">Wait for about 18 months.</text>
  <text x="48" y="914" fill="#2d6a72" font-family="Georgia, serif" font-size="16">You raise the instinct. You wait for adulthood.</text>
  <ellipse cx="600" cy="876" rx="86" ry="60" fill="#f4ead4" stroke="#d4c7ab" stroke-width="2"/>
  <ellipse cx="600" cy="828" rx="42" ry="32" fill="#f4ead4" stroke="#d4c7ab" stroke-width="2"/>
  <circle cx="586" cy="824" r="3" fill="#07101f"/>
  <circle cx="612" cy="824" r="3" fill="#07101f"/>

  <text x="360" y="1038" text-anchor="middle" fill="#d4c7ab" font-family="Georgia, serif" font-size="16">You raise the instinct. You wait for adulthood.</text>
</svg>
